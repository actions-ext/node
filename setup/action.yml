name: Setup Node
description: 'Ensure NNode is installed, and setup pnpm with caching'

inputs:
  version:
    type: choice
    description: "Version to install"
    options:
      - '20.x'
      - '22.x'
    default: '22.x'
  pnpm_version:
    type: string
    description: 'Optional pnpm version override'
    default: ''
  js_folder:
    type: string
    description: 'Path to package.json'
    default: 'js'

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      id: pnpm
      shell: bash
      env:
        PACKAGE_JSON: "${{ inputs.js_folder }}/package.json"
        PNPM_VERSION: "${{ inputs.pnpm_version }}"
      run: |
        if [[ -z "$PNPM_VERSION" && -f "$PACKAGE_JSON" ]]; then
          PNPM_VERSION=$(node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write((pkg.packageManager || '').replace(/^pnpm@/, ''))" "$PACKAGE_JSON")
        fi
        echo "version=${PNPM_VERSION:-11.11.0}" >> "$GITHUB_OUTPUT"

    - name: Install pnpm ${{ steps.pnpm.outputs.version }}
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm.outputs.version }}

    - name: Set up Node ${{ inputs.version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
      with:
        node-version: ${{ inputs.version }}
        cache: pnpm
        cache-dependency-path: "${{ inputs.js_folder }}/pnpm-lock.yaml"
